name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Offline checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      SANS_AUTO_SKILL_EVOLUTION: '0'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - name: Enable Git long paths on the Windows runner
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0, Node 24
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.lock.txt
      - name: Check repository, evidence and test index
        run: python -B scripts/check_repository.py
      - name: Run offline regressions
        run: python -B -m pytest tests experiment/research/20261007-two-directions experiment/research/20261007-small-capability/test_user_updates.py experiment/research/20261008-auto-research experiment/research/20261009-skill-folding/test_goal_anchor.py -q -W error::pytest.PytestUnhandledThreadExceptionWarning --basetemp=experiment/cache/t --junitxml=experiment/runs/ci/regression.xml
      - name: Check CLI entrypoint
        run: python -B -m agents.main --help
      - name: Check offline benchmark runner
        run: python -B -m benchmarks.smoke --runs-root experiment/runs --run-id ci-offline
